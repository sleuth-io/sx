name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  # Pull requests from forks run without repository secrets, and forks of a
  # public repo have no Anthropic credential of their own. Decide up front
  # whether the review can run so those PRs skip cleanly instead of failing.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      review: ${{ steps.check.outputs.review }}
      skills: ${{ steps.check.outputs.skills }}
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_VAULT_KEY: ${{ secrets.SX_VAULT_SSH_KEY != '' }}
      IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
    steps:
      - id: check
        run: |
          if [ "$IS_FORK" = "true" ]; then
            echo "Skipping Claude review: pull request is from a fork, so repository secrets are unavailable."
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "skills=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_ANTHROPIC_KEY" != "true" ]; then
            echo "Skipping Claude review: ANTHROPIC_API_KEY is not configured."
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "skills=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "review=true" >> "$GITHUB_OUTPUT"
          # Skills are a bonus. Without the vault deploy key the review still
          # runs against the repo's own standards.
          if [ "$HAS_VAULT_KEY" = "true" ]; then
            echo "skills=true" >> "$GITHUB_OUTPUT"
          else
            echo "SX_VAULT_SSH_KEY is not configured; reviewing without installed skills."
            echo "skills=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: guard
    if: needs.guard.outputs.review == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build sx
        run: make build

      # The skills vault is a private git repository (sleuth-io/ai-assets).
      # GITHUB_TOKEN only reaches the repo this workflow runs in, so sx
      # authenticates to the vault with a read-only deploy key passed inline
      # via SX_SSH_KEY. See docs/github-actions.md for the full story.
      - name: Setup sx config
        if: needs.guard.outputs.skills == 'true'
        run: |
          mkdir -p $HOME/.config/sx
          mkdir -p $HOME/.claude
          printf '%s\n' '{' \
            '  "defaultProfile": "default",' \
            '  "profiles": {' \
            '    "default": {' \
            '      "type": "git",' \
            '      "repositoryUrl": "git@github.com:sleuth-io/ai-assets.git"' \
            '    }' \
            '  },' \
            '  "forceEnabledClients": ["claude-code"]' \
            '}' > $HOME/.config/sx/config.json

      - name: Install skills
        if: needs.guard.outputs.skills == 'true'
        env:
          SX_SSH_KEY: ${{ secrets.SX_VAULT_SSH_KEY }}
          # Install as the vault's CI bot so team- and bot-scoped skills for
          # this repo resolve, not just repo-scoped and org-wide ones.
          SX_BOT: SX Bot
        run: ./dist/sx install

      # sx removes its temp copy of the inline key on exit; this is belt and
      # braces so the review agent below can never find one in $TMPDIR.
      - name: Scrub SSH key temp files
        if: always() && needs.guard.outputs.skills == 'true'
        run: rm -f "${TMPDIR:-/tmp}"/ssh-key-*

      - name: Discover installed Claude skills
        id: discover-skills
        run: |
          if [ -d ".claude/skills" ]; then
            SKILLS=$(find .claude/skills -name "SKILL.md" -type f | \
              sed 's|.claude/skills/||' | \
              sed 's|/SKILL.md||' | \
              tr '\n' ',' | \
              sed 's/,$//')

            if [ -z "$SKILLS" ]; then
              echo "skills=none" >> $GITHUB_OUTPUT
              echo "No Claude skills found"
            else
              echo "skills=$SKILLS" >> $GITHUB_OUTPUT
              echo "Found skills: $SKILLS"
            fi
          else
            echo "skills=none" >> $GITHUB_OUTPUT
            echo ".claude/skills directory not found"
          fi

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 50"
          track_progress: true
          allowed_bots: "hetchy-app"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request using the project's installed Claude skills and CLAUDE.md standards.

            **Installed Skills**: ${{ steps.discover-skills.outputs.skills }}

            **Process**:
            1. Read SKILL.md files in .claude/skills/[skill-name]/SKILL.md
            2. Review PR changes and match to relevant skills
            3. Validate against skill guidelines and CLAUDE.md standards
            4. Check for security, performance, and architecture issues

            **Output Format**:

            Start with a single sentence summarizing the overall review.

            Then output ONLY the collapsible sections below (one per issue):

            <details>
            <summary><b>[PRIORITY]</b> Single sentence summary</summary>

            **Location**: file:line

            **Issue**: Detailed description

            **Suggestion**: Concrete fix

            </details>

            If no issues found, output: "Review complete. No issues found."

            **Rules**:
            - First line: one sentence overall summary
            - Then ONLY the <details> blocks, nothing else
            - Do NOT include headings, categories, or additional summaries
            - Do NOT add explanatory text between issues
            - Each issue is one <details> block with priority in the summary
            - Ensure blank lines before and after markdown content inside details tags
        timeout-minutes: 15
